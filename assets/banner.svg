<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="git-orange" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="node-glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.85}50%{transform:scale(1.15);opacity:1}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-15px) translateX(10px);opacity:.8}}.title-text{font-weight:800;font-size:42px;fill:url(#title-grad);letter-spacing:-.5px}.badge-label,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.sub-text{font-weight:400;font-size:18px;fill:#94a3b8;letter-spacing:.2px}.badge-label{font-weight:600;font-size:13px;fill:#e2e8f0}.flow-line{stroke-dasharray:8 12;animation:dash 5s linear infinite}.flow-line-fast{stroke-dasharray:6 10;animation:dash 3s linear infinite}.pulse-node{animation:pulse 3s ease-in-out infinite;transform-origin:center}.p1{animation:floatParticle 6s ease-in-out infinite}.p2{animation:floatParticle 8s ease-in-out infinite 1s}.p3{animation:floatParticle 7s ease-in-out infinite 2s}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><rect width="1198" height="358" x="1" y="1" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" rx="15"/><g opacity=".35"><path stroke="#334155" stroke-linecap="round" stroke-width="3" d="M 60 290 H 1140"/><path stroke="url(#accent-cyan)" stroke-linecap="round" stroke-width="3" d="M 60 290 H 1140" class="flow-line"/><path fill="none" stroke="url(#git-orange)" stroke-width="2.5" d="M 180 290 C 240 290, 260 210, 340 210 H 680 C 740 210, 770 290, 840 290" class="flow-line"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 450 210 C 500 210, 520 140, 590 140 H 880 C 940 140, 970 290, 1030 290" class="flow-line-fast"/><circle cx="180" cy="290" r="7" fill="#38bdf8" filter="url(#node-glow)"/><circle cx="340" cy="210" r="6" fill="#f97316"/><circle cx="590" cy="140" r="5" fill="#c084fc"/><circle cx="680" cy="210" r="6" fill="#f97316"/><circle cx="840" cy="290" r="7" fill="#38bdf8"/><circle cx="880" cy="140" r="5" fill="#c084fc"/><circle cx="1030" cy="290" r="7" fill="#38bdf8"/><circle cx="200" cy="80" r="50" fill="#3b82f6" class="p1" filter="url(#glow)" opacity=".1"/><circle cx="1050" cy="100" r="70" fill="#8b5cf6" class="p2" filter="url(#glow)" opacity=".12"/><circle cx="600" cy="50" r="40" fill="#06b6d4" class="p3" filter="url(#glow)" opacity=".08"/></g><g><g transform="translate(60, 45)"><rect width="270" height="30" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="5" fill="#38bdf8" class="pulse-node"/><text x="32" y="20" fill="#38bdf8" class="badge-label">ENTERPRISE DEVOPS &amp; SCM</text></g><text x="0" y="85" class="title-text" transform="translate(60, 45)">Enterprise Git Repository Management</text><text x="0" y="122" class="sub-text" transform="translate(60, 45)">Curated guide to SaaS, self-managed platforms, and open-source code hosting</text><g transform="translate(60, 45) translate(0, 150)"><rect width="130" height="32" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="8"/><text x="14" y="21" class="badge-label">📦 Self-Hosted</text><g transform="translate(142, 0)"><rect width="165" height="32" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="8"/><text x="14" y="21" class="badge-label">⚡ CI/CD &amp; Pipelines</text></g><g transform="translate(319, 0)"><rect width="150" height="32" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="8"/><text x="14" y="21" class="badge-label">🔍 Code Review</text></g><g transform="translate(481, 0)"><rect width="175" height="32" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="8"/><text x="14" y="21" class="badge-label">🛡️ Enterprise Security</text></g><g transform="translate(668, 0)"><rect width="145" height="32" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="8"/><text x="14" y="21" class="badge-label">🌟 Open-Source</text></g></g></g><g opacity=".85" transform="translate(1010, 50)"><rect width="110" height="110" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="24"/><path stroke="#f97316" stroke-linecap="round" stroke-width="5" d="M 40 25 V 85"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="5" d="M 40 45 C 55 45, 75 55, 75 70 V 85"/><circle cx="40" cy="25" r="8" fill="#f97316"/><circle cx="40" cy="85" r="8" fill="#f97316"/><circle cx="75" cy="85" r="8" fill="#38bdf8"/></g></s