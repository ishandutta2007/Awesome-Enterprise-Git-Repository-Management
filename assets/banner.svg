<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="git-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Branch Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#title-grad);
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    /* Dynamic pulsing & flowing animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dash 5s linear infinite;
    }
    .flow-line-fast {
      stroke-dasharray: 6 10;
      animation: dash 3s linear infinite;
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: center;
    }
    .p1 { animation: floatParticle 6s ease-in-out infinite; }
    .p2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 7s ease-in-out infinite 2s; }
    ]]>
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Border Outline -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- DYNAMIC BACKGROUND ELEMENTS: Git Branch Network (Behind foreground text) -->
  <g opacity="0.35">
    <!-- Main Trunk -->
    <path d="M 60 290 H 1140" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 290 H 1140" stroke="url(#accent-cyan)" stroke-width="3" stroke-linecap="round" class="flow-line"/>

    <!-- Feature Branch 1 -->
    <path d="M 180 290 C 240 290, 260 210, 340 210 H 680 C 740 210, 770 290, 840 290" 
          fill="none" stroke="url(#git-orange)" stroke-width="2.5" class="flow-line"/>

    <!-- Feature Branch 2 -->
    <path d="M 450 210 C 500 210, 520 140, 590 140 H 880 C 940 140, 970 290, 1030 290" 
          fill="none" stroke="#a855f7" stroke-width="2" class="flow-line-fast"/>

    <!-- Floating Data Nodes in background -->
    <circle cx="180" cy="290" r="7" fill="#38bdf8" filter="url(#node-glow)"/>
    <circle cx="340" cy="210" r="6" fill="#f97316"/>
    <circle cx="590" cy="140" r="5" fill="#c084fc"/>
    <circle cx="680" cy="210" r="6" fill="#f97316"/>
    <circle cx="840" cy="290" r="7" fill="#38bdf8"/>
    <circle cx="880" cy="140" r="5" fill="#c084fc"/>
    <circle cx="1030" cy="290" r="7" fill="#38bdf8"/>

    <!-- Ambient glowing light spots -->
    <circle cx="200" cy="80" r="50" fill="#3b82f6" opacity="0.1" filter="url(#glow)" class="p1"/>
    <circle cx="1050" cy="100" r="70" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" class="p2"/>
    <circle cx="600" cy="50" r="40" fill="#06b6d4" opacity="0.08" filter="url(#glow)" class="p3"/>
  </g>

  <!-- FOREGROUND CONTENT: Header, Brand & Title (Crisp, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(60, 45)">
    <!-- Top Category Pill -->
    <g>
      <rect width="270" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#38bdf8" class="pulse-node"/>
      <text x="32" y="20" class="badge-label" fill="#38bdf8">ENTERPRISE DEVOPS &amp; SCM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text">
      Enterprise Git Repository Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" class="sub-text">
      Curated guide to SaaS, self-managed platforms, and open-source code hosting
    </text>

    <!-- Feature Attribute Badges / Pills -->
    <g transform="translate(0, 150)">
      <!-- Pill 1: Self-Hosted -->
      <rect width="130" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="14" y="21" class="badge-label">📦 Self-Hosted</text>

      <!-- Pill 2: DevSecOps & CI/CD -->
      <g transform="translate(142, 0)">
        <rect width="165" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" class="badge-label">⚡ CI/CD &amp; Pipelines</text>
      </g>

      <!-- Pill 3: Code Review & PRs -->
      <g transform="translate(319, 0)">
        <rect width="150" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" class="badge-label">🔍 Code Review</text>
      </g>

      <!-- Pill 4: High Availability & Governance -->
      <g transform="translate(481, 0)">
        <rect width="175" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" class="badge-label">🛡️ Enterprise Security</text>
      </g>

      <!-- Pill 5: Open-Source -->
      <g transform="translate(668, 0)">
        <rect width="145" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" class="badge-label">🌟 Open-Source</text>
      </g>
    </g>
  </g>

  <!-- Git Icon Graphic (Right side decoration) -->
  <g transform="translate(1010, 50)" opacity="0.85">
    <rect width="110" height="110" rx="24" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <!-- Git Branch Branching Emblem -->
    <path d="M 40 25 V 85" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <path d="M 40 45 C 55 45, 75 55, 75 70 V 85" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="40" cy="25" r="8" fill="#f97316"/>
    <circle cx="40" cy="85" r="8" fill="#f97316"/>
    <circle cx="75" cy="85" r="8" fill="#38bdf8"/>
  </g>
</svg>
